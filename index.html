<div class="shell"><aside class="side"><div class="brand"><div class="brand-icon">📖</div><div>ReadRise<small>CET-6 · 600 PLAN</small></div></div><nav class="nav" id="desktopNav"></nav><div class="side-note"><b>🌿 每天一点点，真的会不一样。</b>不追求一口气刷完所有题，而是做题、看懂、复盘，形成自己的节奏。</div></aside><main class="main"><div class="topbar"><div><div class="eyebrow" id="headerGreeting">YOUR READING SPACE</div><div class="date-line" id="todayDate"></div></div><div class="pill">🎯 CET-6 600</div></div><div id="app"></div><div class="footer-note">ReadRise v1 · 原创模拟阅读题（非历年真题） · 数据仅存于当前浏览器，跨设备不会自动同步。</div></main></div>

<script>
const BANK=[{"id": "sleep", "type": "careful", "typeLabel": "仔细阅读", "title": "Why Sleep Is Not Lost Time", "topic": "神经科学 · 学习", "minutes": 10, "passage": "University students often regard sleep as a flexible expense: when deadlines multiply, they borrow an hour from the night and promise to repay it after the examination. Yet the apparent convenience of this strategy hides a complicated trade-off. Sleep is not simply a period when the brain stops processing information. During sleep, recently acquired experiences are reorganized, and some memories become more stable while less useful details gradually lose their priority.\n\nResearchers distinguish several processes involved in learning. Encoding occurs when a student first encounters an idea. Consolidation helps the memory survive beyond the immediate learning session, while retrieval allows it to be used later. A student who spends an extra hour memorizing definitions may improve initial encoding, but shortened sleep can interfere with consolidation. As a result, more time spent studying does not necessarily lead to better performance the following week.\n\nHowever, the relationship should not be reduced to a simple rule that every additional minute of sleep produces a predictable increase in examination scores. Experimental findings depend on age, previous sleep habits, the kind of material learned and the time at which performance is measured. Some studies examine pairs of words; others involve motor skills or emotionally significant events. These different tasks do not all respond in precisely the same way.\n\nThe practical implication is that students should view rest as part of their learning strategy rather than as a reward earned only after all work is finished. Regular sleep and planned retrieval practice can complement one another. For example, reviewing an article on Monday and testing one's understanding on Tuesday may be more productive than reading it repeatedly late into Monday night. An effective plan also includes the less glamorous work of identifying errors instead of merely counting completed pages.\n\nA wider lesson concerns efficiency. Educational advice often celebrates visible effort, such as long hours in a library, while neglecting the conditions under which effort becomes useful. A more realistic measure of successful study is not how long someone remained awake with a textbook open, but how accurately they can explain and apply what they learned days later.", "questions": [{"prompt": "What is the main purpose of the passage?", "options": ["To argue that students should stop studying at night.", "To explain why sleep and retrieval practice belong in effective learning.", "To prove that consolidation occurs only during dreams.", "To compare medical students with other undergraduates."], "answer": 1, "explain": "全文主旨是睡眠参与记忆巩固，合理睡眠应与主动提取练习配合。"}, {"prompt": "What can be inferred about studying for an extra hour at the expense of sleep?", "options": ["It always harms initial encoding.", "It guarantees better examination results.", "Its short-term benefit may not translate into lasting learning.", "It prevents all forms of memory retrieval."], "answer": 2, "explain": "第二段承认额外学习可能改善初始编码，但睡眠减少可能损害巩固。"}, {"prompt": "Why does the author mention different experimental tasks?", "options": ["To show that results cannot be generalized without qualifications.", "To suggest that researchers use unreliable methods.", "To claim that motor learning is more important than vocabulary.", "To argue that older adults need no sleep."], "answer": 0, "explain": "第三段强调研究结果受任务、年龄和测试时间等条件影响。"}, {"prompt": "The word “glamorous” is closest in meaning to _____.", "options": ["expensive", "attractive", "dangerous", "technical"], "answer": 1, "explain": "less glamorous work 指“不那么吸引人、容易被忽略的工作”。"}, {"prompt": "Which activity would best follow the author’s recommendation?", "options": ["Reading the same article five times without checking understanding.", "Staying awake until dawn to memorize every detail.", "Counting hours in the library as the only measure of progress.", "Sleeping regularly and checking what one remembers the next day."], "answer": 3, "explain": "第四段明确推荐有计划的主动提取、睡眠及错误分析。"}]}, {"id": "attention", "type": "careful", "typeLabel": "仔细阅读", "title": "The Hidden Cost of Constant Notifications", "topic": "心理学 · 数字生活", "minutes": 10, "passage": "Modern devices make communication nearly effortless. A short message can reach a friend across the world, and a reminder may prevent an important appointment from being forgotten. Yet the same convenience can create a stream of interruptions that changes how people approach demanding intellectual tasks. The difficulty is not necessarily that every notification consumes many seconds. It is that attention has to be redirected, sometimes repeatedly, between different goals.\n\nConsider a student reading a complicated explanation of climate policy. To make sense of the argument, she must hold earlier claims in mind while evaluating new evidence. When a message appears, she may glance at the screen and return to the paragraph immediately. Nevertheless, she might need extra effort to reconstruct the relationships among the ideas. This cost is easy to miss because the interruption itself was brief.\n\nSome technology companies have responded by offering focus settings, scheduled summaries and tools that measure screen time. These features can be helpful, but they also illustrate a limitation of solutions based entirely on individual self-control. If classmates expect answers within minutes and group projects are managed through multiple messaging channels, disabling alerts may carry social or practical costs. Attention is therefore shaped partly by shared expectations, not just personal discipline.\n\nResearchers also warn against treating all digital activity as interchangeable. A video call with a distant relative, an online language lesson and endless scrolling through unrelated clips may involve the same device but serve very different purposes. Time spent online is a crude measure unless the quality and context of the activity are considered. Likewise, a person who frequently checks a phone may be responding to work demands rather than seeking entertainment.\n\nA sensible response combines personal habits with changes in the surrounding environment. Students can reserve a short block of uninterrupted time for close reading and explain to their peers when they will respond. Teachers can make deadlines and communication expectations explicit. The aim is not to eliminate digital communication, but to make it easier for people to choose when to be available and when to think deeply.", "questions": [{"prompt": "What issue does the passage primarily examine?", "options": ["Why smartphones should be banned on campus.", "How interruptions and social expectations affect focused work.", "How long students spend watching online videos.", "Why online language lessons are ineffective."], "answer": 1, "explain": "全文讨论通知造成的任务切换成本，以及群体沟通规范对专注力的影响。"}, {"prompt": "Why might a brief notification still be costly?", "options": ["It destroys the information already read.", "It permanently changes long-term memory.", "Readers may need to rebuild their understanding of an argument.", "It always causes students to miss deadlines."], "answer": 2, "explain": "第二段指出重新建立论证关系本身就会消耗注意力。"}, {"prompt": "What limits the usefulness of simply turning off notifications?", "options": ["Most phones do not provide such a function.", "Students may be expected to respond quickly to others.", "Notifications are essential for memory formation.", "Focus settings increase message volume."], "answer": 1, "explain": "第三段强调同学及团队的及时回复期待。"}, {"prompt": "The author considers screen-time statistics _____.", "options": ["sufficient to measure digital well-being", "more reliable than direct observation", "useful only for researchers", "incomplete without information about activity and context"], "answer": 3, "explain": "第四段认为单纯统计时长是粗略指标，活动质量和情境同样关键。"}, {"prompt": "Which proposal is most consistent with the passage?", "options": ["Agreeing on response windows for group work.", "Answering all messages the moment they arrive.", "Removing all digital tools from the classroom.", "Judging productivity solely by time offline."], "answer": 0, "explain": "结尾建议明确沟通规则和专注时段。"}]}, {"id": "cities", "type": "careful", "typeLabel": "仔细阅读", "title": "Who Gets to Enjoy a Cooler City?", "topic": "环境 · 公共政策", "minutes": 10, "passage": "When a city experiences a severe heat wave, temperature is not distributed evenly across its neighborhoods. Streets covered with asphalt, buildings that retain warmth and limited vegetation can make some areas considerably hotter than nearby districts with mature trees and shaded parks. Such differences are sometimes described as an urban heat island effect, but the term alone does not explain why certain residents face greater exposure than others.\n\nUrban planners increasingly turn to tree planting as a relatively visible response. Trees provide shade, and through the release of water vapor they may help cool the surrounding air. They can also improve the appearance of streets and create inviting public spaces. Yet a planting campaign cannot be judged simply by the number of seedlings placed in the ground. Young trees require appropriate species selection, sufficient soil, water and years of maintenance before they provide substantial shade.\n\nThere is also a question of fairness. In some cities, wealthier neighborhoods already have greater tree coverage and resources to maintain it. If municipal funding follows requests from the most organized residents, new projects may reinforce existing differences. Conversely, planting trees without consulting communities can create other problems, including concerns about maintenance costs or changes in housing prices. Fairness requires more than placing identical numbers of trees in every district; it calls for attention to who faces the greatest risks and who participates in decisions.\n\nMoreover, trees are not a substitute for all other protective measures. During unusually hot nights, accessible cooling centers, reliable public transport and well-insulated homes may be just as important as shade during the day. Public health agencies may need to reach older residents who live alone or workers who spend long hours outdoors. The most effective strategy is likely to combine urban design with targeted social support.\n\nAs cities assess their progress, researchers recommend measuring survival rates of planted trees, changes in local temperatures and the experiences of residents. These indicators reveal more than the total number of trees purchased. The central challenge is to move from attractive announcements toward policies that deliver durable protection where it is needed most.", "questions": [{"prompt": "What does the author suggest about urban heat exposure?", "options": ["It is identical across all parts of a city.", "It may differ greatly across neighborhoods.", "It is caused exclusively by public transport.", "It can be eliminated by planting seedlings."], "answer": 1, "explain": "首段强调不同街区的热暴露不均衡。"}, {"prompt": "Why is the number of planted seedlings an inadequate measure of success?", "options": ["Young trees require care and time before offering meaningful shade.", "Seedlings produce more heat than asphalt.", "All tree species grow at the same rate.", "Tree planting has no influence on local temperatures."], "answer": 0, "explain": "第二段解释树木成活、养护和长成后的效果比数量更重要。"}, {"prompt": "Which factor could make tree planting less equitable?", "options": ["Evaluating tree survival after several years.", "Prioritizing neighborhoods with high heat exposure.", "Allocating funds mainly to residents who organize the most requests.", "Consulting local residents before making decisions."], "answer": 2, "explain": "第三段指出依靠组织能力强的居民提出申请，可能加剧差距。"}, {"prompt": "What is the role of cooling centers in the argument?", "options": ["They demonstrate that trees are unnecessary.", "They illustrate complementary protection against heat.", "They reduce the need for community participation.", "They are useful only in the winter."], "answer": 1, "explain": "第四段用降温中心说明单一的绿化措施不足以应对全部热风险。"}, {"prompt": "The final paragraph emphasizes the importance of _____.", "options": ["attractive public announcements", "immediate cost reductions", "avoiding all urban construction", "evaluating actual long-term outcomes"], "answer": 3, "explain": "最后一段主张衡量实际生存率、降温效果与居民体验。"}]}, {"id": "medicine", "type": "careful", "typeLabel": "仔细阅读", "title": "Why Responsible Antibiotic Use Is Everyone’s Concern", "topic": "医学 · 公共卫生", "minutes": 10, "passage": "Antibiotics transformed medicine by making many bacterial infections treatable. Their success, however, has also created a serious collective problem. When antibiotics are used unnecessarily or incorrectly, bacteria that can survive treatment may become more common. This process contributes to antimicrobial resistance, which makes some infections harder and more expensive to treat.\n\nA widespread misunderstanding is that individual patients themselves become resistant to antibiotics. In fact, it is the microorganisms that evolve or acquire traits that protect them against particular drugs. The distinction matters because resistant bacteria can spread between people, meaning that decisions made in one setting may influence treatment options elsewhere. Hospitals, farms, communities and international travel all connect the issue to wider systems.\n\nReducing inappropriate use does not mean denying medicine to those who need it. Rather, clinicians aim to select an effective antibiotic when a bacterial infection is likely, use a suitable dose and duration, and reconsider treatment as additional evidence becomes available. Diagnostic tests can help, but they may be costly, unavailable or too slow to guide an urgent decision. Responsible prescribing therefore requires clinical judgment under uncertainty, rather than a mechanical rule that antibiotics should always be avoided.\n\nPatients also have an important role. For example, antibiotics are not effective against viral colds, and pressuring a clinician to prescribe them in that situation can cause harm without offering a corresponding benefit. At the same time, public communication should avoid blaming patients who are dealing with frightening symptoms or have limited access to reliable information. Trust and clear explanations often produce better decisions than simply repeating warnings about resistance.\n\nFinally, scientists emphasize that prevention can reduce the need for treatment in the first place. Vaccination, infection control, clean water and safe medical practices all help lower the spread of infectious disease. Developing new antibiotics remains valuable, but new drugs alone cannot solve the problem if the conditions that encourage resistance remain unchanged. Preserving effective treatments is ultimately a shared responsibility.", "questions": [{"prompt": "Which statement best expresses the central argument?", "options": ["Antibiotics should rarely be prescribed in hospitals.", "Antimicrobial resistance requires responsible use and prevention across society.", "Patients are becoming genetically resistant to common medicine.", "New antibiotics have made infection control unnecessary."], "answer": 1, "explain": "文章将合理用药、公共沟通与感染预防联系起来。"}, {"prompt": "What is the misconception discussed in paragraph two?", "options": ["Bacteria can spread from one person to another.", "Drug development is expensive.", "It is the patient, rather than microbes, who becomes resistant.", "Travel connects different health systems."], "answer": 2, "explain": "第二段直接纠正“患者身体变得耐药”的常见误解。"}, {"prompt": "Why does the author mention delayed diagnostic tests?", "options": ["To show why prescribing sometimes requires decisions under uncertainty.", "To prove that diagnostic testing should be abandoned.", "To argue that all infections are viral.", "To suggest that laboratories are responsible for resistance."], "answer": 0, "explain": "第三段说明检测有时无法及时给出答案，所以需要综合判断。"}, {"prompt": "How should public communication about antibiotic use be approached?", "options": ["By making patients feel guilty for seeking care.", "By avoiding explanations that might take time.", "By discouraging all requests for medical assistance.", "By combining accurate guidance with empathy and trust."], "answer": 3, "explain": "第四段反对指责患者，强调解释和信任。"}, {"prompt": "Which measure could reduce the demand for antibiotics?", "options": ["Making medicine available without guidance.", "Improving infection prevention and vaccination.", "Increasing unnecessary prescriptions.", "Using newer drugs for every viral cold."], "answer": 1, "explain": "末段指出预防感染本身可减少治疗需要。"}]}, {"id": "science", "type": "careful", "typeLabel": "仔细阅读", "title": "Can Ordinary People Help Produce Good Science?", "topic": "科研方法 · 数据", "minutes": 10, "passage": "Scientific research is often imagined as work conducted by specialists in well-equipped laboratories. Yet many projects depend on observations made beyond laboratory walls. Volunteers record the dates when flowers bloom, identify birds in local parks or measure air quality near busy roads. This approach, frequently called citizen science, can extend the geographic reach of research and introduce people to the process of collecting evidence.\n\nOne advantage is scale. A small professional team may struggle to visit hundreds of locations throughout the year, whereas thousands of local participants can gather observations across seasons. The resulting records may reveal patterns that would otherwise remain hidden. However, a large data set does not automatically become a reliable one. Participants may interpret instructions differently, use different equipment or prefer recording unusual events instead of ordinary ones. These habits can introduce systematic bias.\n\nGood projects therefore invest in training, clear definitions and quality checks. An application might ask volunteers to attach photographs so that experts or experienced participants can verify difficult identifications. Researchers may also compare volunteer records with measurements made using standardized equipment. Such methods do not eliminate every error, but they make uncertainty more visible and allow analysts to judge how much confidence to place in a finding.\n\nParticipation can also raise ethical questions. Volunteers may contribute considerable time without receiving recognition, and information about an observation's location could reveal something about the person who made it. Organizers should explain how data will be used, protect sensitive information when appropriate and acknowledge contributions. Projects that rely on community cooperation are less likely to flourish when communities feel their involvement has been taken for granted.\n\nCitizen science is thus neither a miracle solution to expensive research nor merely an educational hobby. Its value depends on the relationship between the questions being asked, the design of data collection and the people doing the work. When those elements align, public participation can produce useful evidence while making scientific inquiry more accessible.", "questions": [{"prompt": "What is one benefit of citizen science emphasized in the passage?", "options": ["It removes the need for professional researchers.", "It helps gather observations across many places and times.", "It guarantees perfectly accurate data.", "It makes scientific equipment unnecessary."], "answer": 1, "explain": "第二段讲志愿者网络可以扩大时空覆盖范围。"}, {"prompt": "Why may a large volunteer data set still be biased?", "options": ["Research questions are always too narrow.", "All volunteers deliberately falsify records.", "Participants may collect or interpret observations differently.", "Standardized equipment cannot measure nature."], "answer": 2, "explain": "第二段列举不同理解、设备、偏好带来的系统性偏差。"}, {"prompt": "What is the purpose of attaching photographs to observations?", "options": ["To help verify difficult identifications.", "To replace all data collection instructions.", "To collect personal information for advertising.", "To ensure that volunteers never make mistakes."], "answer": 0, "explain": "第三段提出照片可用于核查较难识别的记录。"}, {"prompt": "Which ethical concern is mentioned?", "options": ["Whether scientists should stop working in laboratories.", "Whether all observations must be made indoors.", "Whether volunteers should be paid identical wages.", "Whether contributors are acknowledged and privacy is respected."], "answer": 3, "explain": "第四段提到贡献认可、位置隐私和数据使用说明。"}, {"prompt": "The author’s attitude toward citizen science is best described as _____.", "options": ["unconditionally enthusiastic", "balanced and conditional", "strongly dismissive", "indifferent"], "answer": 1, "explain": "结尾强调其价值依赖研究问题、数据设计和参与者之间的匹配。"}]}, {"id": "library", "type": "matching", "typeLabel": "长篇阅读 · 匹配（精简练习）", "title": "The University Library Is Changing", "topic": "校园 · 教育", "minutes": 12, "sections": [["A", "For decades, university libraries were judged partly by the number of books they owned. Large collections suggested scholarly prestige. Digital journals and searchable databases have complicated that picture. Students can now access much academic material from a dormitory, but the need for assistance in deciding which sources deserve trust has not disappeared."], ["B", "Some libraries have transformed portions of their buildings into collaborative spaces. Movable furniture and reservable rooms let students rehearse presentations and work on group projects. These changes can be popular, yet they sometimes provoke complaints from readers who value uninterrupted silence. Effective design therefore separates activities instead of assuming one environment suits everyone."], ["C", "A growing number of librarians teach information-literacy classes. Rather than telling students simply to avoid the internet, they demonstrate how to identify an author, assess supporting evidence and trace a claim to its original publication. These skills are particularly important when convincing-looking summaries circulate more quickly than their sources."], ["D", "Libraries also face difficulties with the price and terms of digital resources. An electronic journal may appear to take little physical space, but universities often purchase access through recurring licenses rather than owning permanent copies. A sudden price increase or discontinued subscription can limit what students are able to read."], ["E", "Extended opening hours can support students with varied schedules, especially those balancing study and part-time work. However, maintaining a building overnight involves staffing, security and energy costs. Some universities respond with designated late-night study zones instead of keeping every service available at every hour."], ["F", "Accessibility is another major priority. Screen-reader-compatible files, adjustable desks, captioned videos and clear navigation help people with different needs use the library independently. An attractive new facility is not necessarily inclusive if practical barriers prevent some students from using its resources."], ["G", "Many libraries now lend objects such as cameras, microphones or portable chargers in addition to books. Sharing equipment can lower costs for student projects and reduce unnecessary purchases. Still, loan periods and maintenance plans must be carefully managed so that popular equipment remains available when needed."], ["H", "The future of the library will likely be shaped by local needs rather than a single universal blueprint. Universities should gather feedback from students, teachers and staff, test changes and evaluate results. The strongest institutions may be those that preserve spaces for sustained attention while also supporting new forms of learning."]], "questions": [{"prompt": "The difficulty of ensuring online publications remain available when subscription terms change.", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "answer": 3, "explain": "D段提及数字资源定期授权、涨价或停订会影响可用性。"}, {"prompt": "Learning to evaluate the origin and reliability of information.", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "answer": 2, "explain": "C段讲 information literacy 与追溯原始出版源。"}, {"prompt": "Helping people with different physical or technological needs access services.", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "answer": 5, "explain": "F段列举读屏文件、无障碍桌椅、字幕等。"}, {"prompt": "Balancing group activities with the need for quiet individual study.", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "answer": 1, "explain": "B段说明协作空间与安静阅读者的需求冲突。"}, {"prompt": "Borrowing useful devices instead of buying them for occasional projects.", "options": ["A", "B", "C", "D", "E", "F", "G", "H"], "answer": 6, "explain": "G段介绍设备借用如何降低项目成本。"}]}, {"id": "remote", "type": "cloze", "typeLabel": "选词填空", "title": "Learning Together from a Distance", "topic": "教育 · 社会", "minutes": 9, "passage": "Remote learning can widen access to education, but convenience alone does not guarantee a successful experience. Students benefit when courses provide a clear structure while allowing a [1] approach to completing assignments. Without agreed expectations, communication may become confusing and group projects can lose momentum.\n\nAt the beginning of a course, instructors should [2] the main objectives and explain where reliable materials can be found. They should also establish a [3] between time reserved for independent work and time when students are expected to respond to classmates. Such arrangements are especially helpful for learners who work part-time or share a home with family members.\n\nGood online learning also depends on the quality of feedback. Instead of marking an answer merely right or wrong, teachers can point to the [4] that supports a claim and show students how to improve their reasoning. Feedback should arrive [5] enough for students to apply it to the next assignment.\n\nTechnology can support [6], but a collection of messaging tools does not automatically create meaningful teamwork. Groups need shared goals, defined responsibilities and regular opportunities to discuss progress. Students may initially feel [7], particularly if they are new to the subject or reluctant to ask questions. Short discussions and thoughtful peer support can help them develop confidence.\n\nFinally, institutions must [8] accessible resources and respond when technical difficulties prevent participation. A successful course is not simply one that is [9] online: it is one in which students can consistently learn, communicate and evaluate their progress. The goal should remain educational quality rather than the appearance of technological [10].", "pool": ["adapt", "available", "boundary", "capacity", "clarify", "collaboration", "efficient", "evidence", "flexible", "frequently", "isolated", "maintain", "priority", "reliable", "temporary"], "questions": [{"prompt": "Blank [1]", "options": ["adapt", "available", "boundary", "capacity", "clarify", "collaboration", "efficient", "evidence", "flexible", "frequently", "isolated", "maintain", "priority", "reliable", "temporary"], "answer": 8, "explain": "a flexible approach：灵活的方法；形容词修饰 approach。"}, {"prompt": "Blank [2]", "options": ["adapt", "available", "boundary", "capacity", "clarify", "collaboration", "efficient", "evidence", "flexible", "frequently", "isolated", "maintain", "priority", "reliable", "temporary"], "answer": 4, "explain": "动词原形 clarify goals：解释清楚目标。"}, {"prompt": "Blank [3]", "options": ["adapt", "available", "boundary", "capacity", "clarify", "collaboration", "efficient", "evidence", "flexible", "frequently", "isolated", "maintain", "priority", "reliable", "temporary"], "answer": 2, "explain": "establish a boundary between A and B：划清界限。"}, {"prompt": "Blank [4]", "options": ["adapt", "available", "boundary", "capacity", "clarify", "collaboration", "efficient", "evidence", "flexible", "frequently", "isolated", "maintain", "priority", "reliable", "temporary"], "answer": 7, "explain": "evidence that supports a claim：支持论断的证据。"}, {"prompt": "Blank [5]", "options": ["adapt", "available", "boundary", "capacity", "clarify", "collaboration", "efficient", "evidence", "flexible", "frequently", "isolated", "maintain", "priority", "reliable", "temporary"], "answer": 9, "explain": "frequently enough：足够频繁（及时）地给予反馈。"}, {"prompt": "Blank [6]", "options": ["adapt", "available", "boundary", "capacity", "clarify", "collaboration", "efficient", "evidence", "flexible", "frequently", "isolated", "maintain", "priority", "reliable", "temporary"], "answer": 5, "explain": "collaboration：合作，句中作 support 的宾语。"}, {"prompt": "Blank [7]", "options": ["adapt", "available", "boundary", "capacity", "clarify", "collaboration", "efficient", "evidence", "flexible", "frequently", "isolated", "maintain", "priority", "reliable", "temporary"], "answer": 10, "explain": "feel isolated：感到孤立。"}, {"prompt": "Blank [8]", "options": ["adapt", "available", "boundary", "capacity", "clarify", "collaboration", "efficient", "evidence", "flexible", "frequently", "isolated", "maintain", "priority", "reliable", "temporary"], "answer": 11, "explain": "must maintain：必须维持、保障资源。"}, {"prompt": "Blank [9]", "options": ["adapt", "available", "boundary", "capacity", "clarify", "collaboration", "efficient", "evidence", "flexible", "frequently", "isolated", "maintain", "priority", "reliable", "temporary"], "answer": 1, "explain": "available online：可在线获取。"}, {"prompt": "Blank [10]", "options": ["adapt", "available", "boundary", "capacity", "clarify", "collaboration", "efficient", "evidence", "flexible", "frequently", "isolated", "maintain", "priority", "reliable", "temporary"], "answer": 3, "explain": "technological capacity：技术能力。"}]}];
const STORE_KEY='readrise-cet6-v1';
const MENUS=[['home','🏠','我的首页'],['practice','📚','阅读训练'],['mistakes','🧩','错题本'],['history','📈','成长记录']];
const TYPE={careful:'仔细阅读',matching:'长篇匹配',cloze:'选词填空'};
const ALPHA='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
let state=loadState(),view='home',filter='all',test=null,result=null,tick=null;
function loadState(){try{const raw=JSON.parse(localStorage.getItem(STORE_KEY)||'null');if(raw&&Array.isArray(raw.sessions)&&raw.settings)return raw}catch(e){}return{sessions:[],wrong:{},settings:{previous:511,target:600,daily:1,exam:'2026-12-12'}}}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){toast('当前浏览器限制存储，请导出备份')}}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function el(id){return document.getElementById(id)}
function dayKey(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`}
function dayDiff(from,to){let a=new Date(from+'T00:00:00'),b=new Date(to+'T00:00:00');return Math.round((b-a)/86400000)}
function examDays(){return Math.max(0,dayDiff(dayKey(),state.settings.exam||'2026-12-12'))}
function todaySessions(){return state.sessions.filter(s=>s.day===dayKey())}
function byDay(day){return state.sessions.filter(s=>s.day===day)}
function completedToday(){return todaySessions().length>=Number(state.settings.daily||1)}
function streak(){const days=new Set(state.sessions.map(x=>x.day));let d=new Date(),run=0;if(!days.has(dayKey(d)))d.setDate(d.getDate()-1);while(days.has(dayKey(d))){run++;d.setDate(d.getDate()-1)}return run}
function allStats(){const n=state.sessions.length,correct=state.sessions.reduce((t,s)=>t+s.correct,0),total=state.sessions.reduce((t,s)=>t+s.total,0);return{n,correct,total,rate:total?Math.round(100*correct/total):0}}
function toast(msg){let node=el('toast');node.textContent=msg;node.classList.add('visible');clearTimeout(window._toast);window._toast=setTimeout(()=>node.classList.remove('visible'),2500)}
function nav(target){if(test&&!result&&target!==view&&!confirm('本次练习尚未提交，离开将丢失未提交的答案。确定离开吗？'))return;stopTimer();test=null;result=null;view=target;draw();window.scrollTo({top:0,behavior:'smooth'})}
function drawNav(){for(const id of ['desktopNav','mobileNav']){el(id).innerHTML=MENUS.map(([key,ico,name])=>`<button class="${key===view?'active':''}" data-nav="${key}"><span>${ico}</span><span>${name}</span></button>`).join('')}}
function draw(){drawNav();el('todayDate').textContent=new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});el('app').innerHTML=view==='home'?home():view==='practice'?test?(result?resultsPage():testPage()):practicePage():view==='mistakes'?mistakesPage():historyPage();}
function home(){const s=allStats(),done=todaySessions().length,need=Number(state.settings.daily||1),percentage=Math.min(100,done/need*100),prev=Number(state.settings.previous),goal=Number(state.settings.target),targetRate=Math.round(prev/goal*100);let days=examDays();let end='冲刺中的每一篇阅读，都算数。';if(done>=need)end='今日目标完成！今天的努力已经记下啦。';return `<section class="hero"><div class="hero-main"><div class="sub">✨ YOUR 600-POINT JOURNEY</div><h1>从 ${prev} 分<br>一步步走向 ${goal} 分。</h1><p>${safe(end)}</p><div class="hero-bottom"><span>本轮目标进度 · 当前分数 / 目标分数</span><span>${prev} → ${goal}</span></div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,targetRate)}%"></div></div><div class="hero-bottom"><span>阅读训练只是六级提分的一部分</span><span>${Math.max(0,goal-prev)} 分差距</span></div></div><div class="hero-right"><div><div class="count-label">距离六级笔试</div><div class="big-number">${days}<span style="font-size:20px;letter-spacing:0"> 天</span></div><div class="count-label">${safe(state.settings.exam.slice(5).replace("-"," 月 "))} 日 · 考试日</div></div><div class="calendar">🗓️</div></div></section><section class="stats"><div class="stat"><span>🔥 连续练习</span><strong>${streak()} <small style="font-size:13px">天</small></strong><span>每天做一点，保持手感</span></div><div class="stat"><span>📚 已完成练习</span><strong>${s.n} <small style="font-size:13px">套</small></strong><span>复盘后计入记录</span></div><div class="stat"><span>🎯 累计正确率</span><strong>${s.rate}%</strong><span>仅代表本站练习表现</span></div><div class="stat"><span>🧩 待攻克错题</span><strong>${Object.values(state.wrong).filter(x=>!x.resolved).length} <small style="font-size:13px">道</small></strong><span>复练答对后自动标记</span></div></section><div class="two-col" style="margin-top:21px"><section class="surface"><h3>☀️ 今日学习计划</h3><div class="hint">完成 ${need} 套原创模拟阅读，并认真查看答案解析。</div><div class="today-task"><div class="circle ${done?'done':''}">${done?'✓':'1'}</div><div><strong>完成今日阅读练习</strong><small>已完成 ${done} / ${need} 套 · 限时阅读 + 答题</small></div></div><div class="today-task"><div class="circle ${done?'done':''}">${done?'✓':'2'}</div><div><strong>认真复盘答案解析</strong><small>阅读解析后点击“完成复盘并记录”</small></div></div><div class="today-task"><div class="circle ${done>=need?'done':''}">${done>=need?'✓':'3'}</div><div><strong>${done>=need?'今日已打卡 🎉':'积累连续打卡'}</strong><small>${done>=need?'你已经完成今天的承诺':'练完规定套数自动点亮今日打卡'}</small></div></div><div class="progress-track" style="background:#f0edfa;margin:13px 0"><div class="progress-fill" style="width:${percentage}%"></div></div><button class="primary" data-action="recommend">${done>=need?'继续巩固 →':'开始今日阅读 →'}</button></section><section class="surface"><h3>📊 最近 7 天</h3><div class="hint">每根柱子代表当天完成的练习套数</div>${weeklyChart()}<div style="margin-top:18px;padding:13px;background:#f8f6ff;border-radius:13px;color:#6f669a;font-size:12px">${s.n?'做对多少不如弄清楚错在哪里。今天继续稳稳向前。':'第一篇阅读，从今天开始。完成复盘就能点亮第一天。'}</div></section></div><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><h2 class="section-title">为你准备的阅读</h2><button class="secondary small" data-nav="practice">查看全部 →</button></div><section class="exercise-list">${BANK.slice(0,2).map(exerciseCard).join('')}</section>`}
function weeklyChart(){let h='',now=new Date(),count=[];for(let i=6;i>=0;i--){let d=new Date(now);d.setDate(now.getDate()-i);count.push({day:dayKey(d),n:byDay(dayKey(d)).length,label:['日','一','二','三','四','五','六'][d.getDay()]})}const max=Math.max(2,...count.map(x=>x.n));for(const p of count){let ht=Math.max(6,Math.round(p.n/max*93));h+=`<div class="chart-day"><span>${p.n||''}</span><div class="bar ${p.n?'on':''}" style="height:${ht}px" title="${p.day}：${p.n}套"></div><span>周${p.label}</span></div>`}return `<div class="chart">${h}</div>`}
function exerciseCard(s){const n=state.sessions.filter(x=>x.id===s.id).length;return `<article class="exercise"><div class="tag">${safe(s.typeLabel)}</div><h3>${safe(s.title)}</h3><div class="meta">${safe(s.topic)} · ${s.questions.length} 题 · 建议 ${s.minutes} 分钟</div><div class="bottom"><span>${n?'✓ 已练习 '+n+' 次':'○ 尚未练习'}</span><button class="secondary small" data-start="${s.id}">${n?'再练一遍':'开始练习'} ↗</button></div></article>`}
function practicePage(){return `<div class="page-head"><div class="eyebrow">READING PRACTICE</div><h1>📚 阅读训练室</h1><p>原创六级风格模拟题 · 仔细阅读、长篇匹配、选词填空。题量为精简练习，非完整真题试卷。</p></div><div class="filter">${[['all','全部'],['careful','仔细阅读'],['matching','长篇匹配'],['cloze','选词填空']].map(([id,text])=>`<button class="${filter===id?'active':''}" data-filter="${id}">${text}</button>`).join('')}</div><div class="exercise-list">${BANK.filter(s=>filter==='all'||filter===s.type).map(exerciseCard).join('')}</div>`}
function passageBody(s){if(s.sections)return s.sections.map(([letter,para])=>`<p><span class="para">[${safe(letter)}]</span> ${safe(para)}</p>`).join('');return s.passage.split(/\n\s*\n/).map(p=>`<p>${safe(p).replace(/\[(\d+)\]/g,'<strong style="color:#7b62cb">[$1]</strong>')}</p>`).join('')}
function startSet(id){const s=BANK.find(x=>x.id===id);if(!s)return;test={id,answers:Array(s.questions.length).fill(null),time:s.minutes*60,started:Date.now(),deadline:Date.now()+s.minutes*60000};result=null;view='practice';draw();startTimer();window.scrollTo(0,0)}
function startTimer(){stopTimer();tick=setInterval(()=>{if(!test||result){stopTimer();return}test.time=Math.max(0,Math.ceil((test.deadline-Date.now())/1000));const t=el('clock');if(t){t.textContent=clockStr(test.time);t.classList.toggle('warning',test.time<=60)}if(test.time<=0){stopTimer();submit(true)}},1000)}
function stopTimer(){if(tick){clearInterval(tick);tick=null}}
function clockStr(sec){return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function testPage(){const s=BANK.find(x=>x.id===test.id);return `<div class="test-head"><div><div class="eyebrow">NOW READING · ${safe(TYPE[s.type])}</div><h1>${safe(s.title)}</h1><div class="hint">${safe(s.topic)} · ${s.questions.length} 题 · 请先读文章再作答</div></div><div class="toolbar"><span class="timer" id="clock">${clockStr(test.time)}</span><button class="secondary small" data-action="quit">退出练习</button></div></div><div class="test-layout"><div class="surface passage"><h3 style="display:flex;justify-content:space-between;gap:10px">📄 Reading Passage <span class="muted-mini">英文原文</span></h3><div class="article">${passageBody(s)}</div></div><div><div class="notice" style="margin-bottom:13px">${s.type==='matching'?'请根据题干选择对应段落 A–H，同一段落可能被多次使用。':s.type==='cloze'?'根据文章语境，从选词库中为每个空格选出最恰当的词。':'每题仅有一个最佳答案。提交后可以查看每一道题的中文解析。'}</div>${s.questions.map((q,i)=>`<div class="question" id="question-${i}"><div class="question-title">${i+1}. ${safe(q.prompt)}</div>${q.options.map((op,k)=>`<button class="choice ${test.answers[i]===k?'selected':''}" data-answer="${i}:${k}" aria-pressed="${test.answers[i]===k?'true':'false'}"><span class="key">${ALPHA[k]}</span><span>${safe(op)}</span></button>`).join('')}</div>`).join('')}<div class="test-actions"><span class="hint" id="answerCount">已答 ${test.answers.filter(v=>v!==null).length}/${s.questions.length} 题</span><button class="primary" data-action="submit">提交答卷 · 查看解析 →</button></div></div></div>`}
function answerQuestion(i,k){if(!test||result)return;test.answers[i]=k;const block=el('question-'+i);if(block){block.querySelectorAll('.choice').forEach((btn,idx)=>{btn.classList.toggle('selected',idx===k);btn.setAttribute('aria-pressed',idx===k?'true':'false')})}const s=BANK.find(x=>x.id===test.id);el('answerCount').textContent=`已答 ${test.answers.filter(v=>v!==null).length}/${s.questions.length} 题`}
function submit(forced=false){if(!test||result)return;const s=BANK.find(x=>x.id===test.id),answered=test.answers.filter(v=>v!==null).length;if(!forced&&answered<s.questions.length&&!confirm(`你还有 ${s.questions.length-answered} 道题未作答，确定要交卷吗？`))return;stopTimer();const correct=s.questions.filter((q,i)=>test.answers[i]===q.answer).length;result={correct,total:s.questions.length,duration:Math.max(1,s.minutes*60-test.time),forced};draw();window.scrollTo(0,0)}
function resultsPage(){const s=BANK.find(x=>x.id===test.id),r=result,pct=Math.round(r.correct/r.total*100);return `<div class="result"><div style="font-size:13px;color:#e6deff">✨ 本轮训练报告 · ${safe(TYPE[s.type])}</div><h2>做完了！现在来认真复盘。</h2><div class="score">${pct}% <span style="font-size:16px;font-weight:600">（${r.correct}/${r.total} 正确）</span></div><p>练习用时 ${Math.floor(r.duration/60)} 分 ${r.duration%60} 秒${r.forced?' · 时间到自动交卷':''}。以下是每一道题的答案解析。</p></div><div class="notice" style="margin-bottom:16px">正确率只用于观察练习表现，不能据此换算成真实六级成绩。阅读解析并点击“完成复盘并记录”后，才会保存本次成绩。</div><div class="review-list">${s.questions.map((q,i)=>{const a=test.answers[i],good=a===q.answer;return `<div class="review-card"><h4>${good?'✅':'🔍'} ${i+1}. ${safe(q.prompt)}</h4><p class="${good?'correct-text':'wrong-text'}">你的答案：${a===null?'未作答':ALPHA[a]+' · '+safe(q.options[a])}</p><p class="correct-text">正确答案：${ALPHA[q.answer]} · ${safe(q.options[q.answer])}</p><div class="answer-info"><b>📌 解析：</b>${safe(q.explain)}</div></div>`}).join('')}</div><div class="test-actions" style="margin-top:19px"><button class="secondary" data-action="retry">重新做这一篇</button><button class="primary" data-action="record">我已完成复盘 · 记录成绩 ✓</button></div>`}
function record(){if(!test||!result)return;const s=BANK.find(x=>x.id===test.id),answers=test.answers.slice(),day=dayKey(),key=Date.now().toString(36)+Math.random().toString(36).slice(2,6);state.sessions.push({key,id:s.id,day,when:new Date().toISOString(),correct:result.correct,total:result.total,seconds:result.duration});s.questions.forEach((q,i)=>{const k=s.id+':'+i,good=answers[i]===q.answer;if(!good){let old=state.wrong[k]||{};state.wrong[k]={set:s.id,q:i,tries:(old.tries||0)+1,resolved:false,last:day}}else if(state.wrong[k])state.wrong[k].resolved=true});save();stopTimer();test=null;result=null;view='home';draw();window.scrollTo(0,0);toast('复盘完成！本次练习已记录 ✨')}
function mistakesPage(){let rows=Object.values(state.wrong).filter(x=>!x.resolved).sort((a,b)=>b.last.localeCompare(a.last));return `<div class="page-head"><div class="eyebrow">LEARN FROM MISTAKES</div><h1>🧩 我的错题本</h1><p>答错的题会出现在这里，再次做对原题后自动移到“已攻克”。</p></div><div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:22px"><div class="stat"><span>待攻克</span><strong>${rows.length}</strong><span>下次复练重点照顾它们</span></div><div class="stat"><span>已攻克</span><strong>${Object.values(state.wrong).filter(x=>x.resolved).length}</strong><span>重新做对的题目</span></div></div>${rows.length?`<div class="review-list">${rows.map(w=>{const s=BANK.find(x=>x.id===w.set),q=s?.questions[w.q];if(!q)return'';return `<div class="review-card"><div class="hint">${safe(TYPE[s.type])} · ${safe(s.title)} · 第 ${w.q+1} 题</div><h4 style="margin-top:9px">${safe(q.prompt)}</h4><details style="font-size:13px"><summary style="color:#6255c8;cursor:pointer;font-weight:740">点击查看答案与解析</summary><div class="answer-info">正确答案：${ALPHA[q.answer]} · ${safe(q.options[q.answer])}<p>${safe(q.explain)}</p></div></details><button class="secondary small" style="margin-top:12px" data-start="${s.id}">重新做这篇 →</button></div>`}).join('')}</div>`:`<div class="empty"><div class="art">🌱</div><h3>目前没有待攻克的错题</h3><p>完成一套练习，这里会自动整理做错的题目。</p><button class="primary" data-nav="practice">去阅读训练</button></div>`}`}
function historyPage(){const s=allStats(),sorted=state.sessions.slice().sort((a,b)=>b.when.localeCompare(a.when));return `<div class="page-head"><div class="eyebrow">YOUR GROWTH</div><h1>📈 成长记录</h1><p>不必每天都满分，重要的是把错误变成下一次正确的理由。</p></div><section class="stats" style="margin:0 0 20px"><div class="stat"><span>📚 完成练习</span><strong>${s.n}</strong><span>套</span></div><div class="stat"><span>✏️ 作答题目</span><strong>${s.total}</strong><span>题</span></div><div class="stat"><span>🎯 练习正确率</span><strong>${s.rate}%</strong><span>不是官方六级换算分</span></div><div class="stat"><span>🔥 连续打卡</span><strong>${streak()}</strong><span>天</span></div></section><div class="two-col"><div class="surface"><h3>📅 最近一周的坚持</h3>${weeklyChart()}</div><div class="surface"><h3>⚙️ 我的冲刺设定</h3><div class="hint" style="margin:0 0 16px">自定义目标与每日训练量</div><div class="settings-grid"><div class="field"><label for="previous">上次六级成绩</label><input id="previous" type="number" min="0" max="710" value="${Number(state.settings.previous)}"></div><div class="field"><label for="target">目标分数</label><input id="target" type="number" min="0" max="710" value="${Number(state.settings.target)}"></div><div class="field"><label for="daily">每天完成</label><select id="daily"><option value="1" ${Number(state.settings.daily)===1?'selected':''}>1 套</option><option value="2" ${Number(state.settings.daily)===2?'selected':''}>2 套</option><option value="3" ${Number(state.settings.daily)===3?'selected':''}>3 套</option></select></div><div class="field"><label for="exam">考试日期</label><input id="exam" type="date" value="${safe(state.settings.exam)}"></div></div><div style="margin-top:17px"><button class="primary small" data-action="settings">保存设定</button></div></div></div><section class="surface" style="margin-top:21px"><h3>📝 练习历史</h3>${sorted.length?sorted.map(t=>{let b=BANK.find(x=>x.id===t.id);return `<div class="history-row"><div><strong>${safe(b?.title||t.id)}</strong><span>${safe(t.day)} · ${safe(TYPE[b?.type]||'阅读')} · ${Math.round(t.seconds/60)} 分钟</span></div><div class="ratio">${Math.round(t.correct/t.total*100)}%</div></div>`}).join(''):`<div class="empty" style="margin-top:17px"><div class="art">📖</div>你完成的第一篇阅读，会出现在这里。</div>`}</section><section class="surface" style="margin-top:21px"><h3>💾 我的数据备份</h3><p class="hint">浏览器数据不会自动同步到其他设备。建议每周导出一次 JSON 文件备份，更换浏览器可选择导入。</p><div class="toolbar"><button class="secondary small" data-action="export">导出进度备份</button><button class="secondary small" data-action="import">导入进度备份</button><input type="file" accept="application/json,.json" id="importFile" class="hidden"><button class="secondary small" style="color:#bf5a69" data-action="clear">清空本地记录</button></div></section>`}
function settings(){const previous=Number(el('previous').value),target=Number(el('target').value),daily=Number(el('daily').value),exam=el('exam').value;if(!Number.isFinite(previous)||!Number.isFinite(target)||previous<0||previous>710||target<0||target>710||!exam){toast('请填写有效的分数（0–710）和日期');return}state.settings={previous,target,daily,exam};save();draw();toast('设定已更新')}
function exportBackup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ReadRise-进度备份-'+dayKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importBackup(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.sessions)||!x.settings||typeof x.wrong!=='object'||x.wrong===null)throw Error('格式有误');if(!confirm('导入将替换当前设备的所有 ReadRise 记录，确定继续吗？'))return;state=x;save();draw();toast('已导入备份')}catch(e){toast('不是有效的 ReadRise 备份文件')}};r.readAsText(f)}
function recommend(){let untrained=BANK.find(s=>!state.sessions.some(t=>t.id===s.id));startSet((untrained||BANK[Math.floor(Math.random()*BANK.length)]).id)}
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav],[data-filter],[data-start],[data-answer],[data-action]');if(!n)return;if(n.dataset.nav){nav(n.dataset.nav);return}if(n.dataset.filter){filter=n.dataset.filter;draw();return}if(n.dataset.start){if(test&&!result&&!confirm('放弃当前练习并开始另一篇吗？'))return;startSet(n.dataset.start);return}if(n.dataset.answer){const [i,k]=n.dataset.answer.split(':').map(Number);answerQuestion(i,k);return}if(n.dataset.action){switch(n.dataset.action){case'recommend':recommend();break;case'quit':nav('practice');break;case'submit':submit();break;case'retry':startSet(test.id);break;case'record':record();break;case'settings':settings();break;case'export':exportBackup();break;case'import':el('importFile').click();break;case'clear':if(confirm('这会永久清除当前浏览器保存的所有练习数据，确定清空吗？')){state={sessions:[],wrong:{},settings:{...state.settings}};save();draw();toast('本地记录已清空')}break}}});
document.addEventListener('change',e=>{if(e.target.id==='importFile')importBackup(e)});
draw();
</script>
</body></html>
